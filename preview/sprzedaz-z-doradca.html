<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprzedaż z doradcą — JURKO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf3ee;color:#152e25;font:16px/1.5 system-ui,sans-serif}header{background:#163a2c;color:white;padding:18px max(20px,5vw);font-weight:700}main{max-width:1350px;margin:auto;padding:28px max(16px,3vw)}h1,h2,h3,p{margin:0 0 12px}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}.panel,article{padding:18px;border:1px solid #c9d9cf;border-radius:14px;background:white}.catalog{display:grid;gap:10px;margin-top:16px}.actions{display:flex;flex-wrap:wrap;gap:8px}label{display:grid;gap:6px;margin-bottom:12px}input,select,button{font:inherit;padding:9px 12px;border-radius:7px;border:1px solid #aabfb0}button{cursor:pointer;background:#205e49;color:white}button.secondary{background:white;color:#205e49}li{margin:8px 0}.muted{color:#455d52}@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
<header>JURKO Manager · Sprzedaż z doradcą</header>
<main>
<h1>Wspólna oferta</h1>
<p class="muted">Podgląd rozmowy na danych przykładowych. Obie strony widzisz na jednym ekranie.</p>
<div class="layout">
<section class="panel">
<h2>Panel sprzedawcy</h2>
<label>Szukaj produktu<input id="search" type="search" placeholder="Np. C2TE S1"></label>
<label>Kolekcja lub kategoria<select id="category"><option value="">Wszystkie</option><option>Kleje</option><option>Wełna</option><option>Płytki</option></select></label>
<div class="catalog" id="seller"></div>
</section>
<section class="panel">
<h2>Ekran klienta</h2>
<article id="shown" aria-live="polite">Wybierz „Pokaż klientowi” przy produkcie.</article>
<h3>Moja oferta</h3>
<ul id="offer" aria-live="polite"></ul>
<label>Dodaj z katalogu<select id="customer"></select></label>
<button id="customer-add">Dodaj do oferty</button>
</section>
</div>
</main>
<script>
const catalog=[
 {name:'Klej elastyczny C2TE S1',group:'Kleje',details:'Do gresu i na ogrzewanie podłogowe · 25 kg'},
 {name:'Klej cementowy C1T',group:'Kleje',details:'Do płytek ceramicznych · 25 kg'},
 {name:'Wełna mineralna 150 mm',group:'Wełna',details:'Współczynnik lambda 0,035 W/(m·K)'},
 {name:'Gres dębowy 20 × 120 cm',group:'Płytki',details:'Kolekcja Dąb · mat'}
];
const byId=id=>document.getElementById(id);
const offer=new Map();
function renderOffer(){
 byId('offer').replaceChildren(...Array.from(offer,([product,quantity])=>{
  const row=document.createElement('li');
  row.textContent=product.name+' · ilość: '+quantity+' ';
  const remove=document.createElement('button');
  remove.className='secondary';
  remove.textContent='Usuń';
  remove.onclick=()=>{offer.delete(product);renderOffer()};
  row.append(remove);
  return row;
 }));
}
function add(product){offer.set(product,(offer.get(product)||0)+1);renderOffer()}
function renderCatalog(){
 const query=byId('search').value.toLocaleLowerCase('pl');
 const group=byId('category').value;
 const products=catalog.filter(p=>(!group||p.group===group)&&(p.name+' '+p.details).toLocaleLowerCase('pl').includes(query));
 byId('seller').replaceChildren(...products.map(product=>{
  const card=document.createElement('article');
  const title=document.createElement('h3');
  title.textContent=product.name;
  const details=document.createElement('p');
  details.textContent=product.details;
  const actions=document.createElement('div');
  actions.className='actions';
  const show=document.createElement('button');
  show.className='secondary';
  show.textContent='Pokaż klientowi';
  show.onclick=()=>{byId('shown').replaceChildren(title.cloneNode(true),details.cloneNode(true))};
  const insert=document.createElement('button');
  insert.textContent='Dodaj do oferty';
  insert.onclick=()=>add(product);
  actions.append(show,insert);
  card.append(title,details,actions);
  return card;
 }));
 if(!products.length)byId('seller').textContent='Brak produktów pasujących do wyszukiwania.';
}
byId('search').oninput=renderCatalog;
byId('category').onchange=renderCatalog;
byId('customer').replaceChildren(...catalog.map((product,index)=>new Option(product.name,index)));
byId('customer-add').onclick=()=>add(catalog[Number(byId('customer').value)]);
renderCatalog();
</script>
</html>
