name: Test dostępu OVH
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/ovh-access.yml]
permissions:
  contents: read
jobs:
  access:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: ovh-production
    steps:
      - name: Potwierdź wcześniej zanotowany klucz serwera
        id: host
        run: |
          mkdir -m 700 -p ~/.ssh
          ssh-keyscan -T 15 -t ed25519 ssh.cluster131.hosting.ovh.net > /tmp/ovh-host
          fingerprint=$(ssh-keygen -lf /tmp/ovh-host | awk '{print $2}')
          test "$fingerprint" = 'SHA256:N4DQHF8Pzfs8s5/QgV8tEx5NgKZeghhkDfpnO+ZG7Fo'
          install -m 600 /tmp/ovh-host ~/.ssh/known_hosts
      - name: Sprawdź format hasła i szyfrowane logowanie FTP
        continue-on-error: true
        env:
          OVH_PASSWORD: ${{ secrets.OVH_SSH_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os, re, ssl, sys
          password = os.environ.get("OVH_PASSWORD", "")
          if not (9 <= len(password) <= 30 and re.fullmatch(r"[A-Za-z0-9]+", password)
                  and re.search(r"[A-Z]", password) and re.search(r"[a-z]", password)
                  and re.search(r"[0-9]", password)):
              print("PASSWORD_FORMAT_INVALID: zapis nie spełnia wymagań formularza OVH.")
              sys.exit(1)
          print("PASSWORD_FORMAT_OK")
          stage = "CONNECT"
          try:
              with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=20) as ftp:
                  ftp.connect("ftp.cluster131.hosting.ovh.net", 21)
                  stage = "AUTH_TLS"
                  ftp.auth()
                  stage = "LOGIN"
                  ftp.login("geuveax", password, secure=False)
                  print("FTPS_LOGIN_OK")
          except ftplib.error_perm as exc:
              code = str(exc)[:3]
              print("FTPS_REJECTED_STAGE", stage, "CODE", code if code.isdigit() else "unknown")
              sys.exit(1)
          except Exception as exc:
              print("FTPS_CONNECTION_ERROR:", type(exc).__name__)
              sys.exit(1)
          PY
      - name: Sprawdź hasło i katalog aplikacji bez zmian
        if: always() && steps.host.outcome == 'success'
        env:
          SSHPASS: ${{ secrets.OVH_SSH_PASSWORD }}
        run: |
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o NumberOfPasswordPrompts=1 geuveax@ssh.cluster131.hosting.ovh.net 'printf "SSH_LOGIN_OK\\n"; php -v | head -n 1; test -d "$HOME/www" && printf "WWW_PRESENT\\n"; if test -d "$HOME/www/.git"; then printf "GIT_CHECKOUT_PRESENT\\n"; fi; if test -r "$HOME/jurko-private/config.php"; then printf "DATABASE_CONFIG_PRESENT\\n"; fi'
      - name: Sprawdź połączenie bazy bez odczytu danych firmy
        env:
          SSHPASS: ${{ secrets.OVH_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 geuveax@ssh.cluster131.hosting.ovh.net 'php' <<'PHP'
          <?php
          try {
              require getenv('HOME') . '/www/server/database.php';
              $pdo = jurkoDatabase();
              if ((int)$pdo->query('SELECT 1')->fetchColumn() !== 1) { throw new RuntimeException(); }
              echo "DATABASE_CONNECTION_OK\n";
          } catch (Throwable $e) {
              echo "DATABASE_CONNECTION_FAILED\n";
              exit(1);
          }
          PHP
      - name: Sprawdź stan instalacji i HTTPS bez danych firmy
        env:
          SSHPASS: ${{ secrets.OVH_SSH_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=20 geuveax@ssh.cluster131.hosting.ovh.net 'for p in jurko-stage jurko-deploy.lock www/app/style.css jurko-private/auth.php; do if test -e "$HOME/$p"; then printf "PRESENT %s\n" "$p"; fi; done; ps -u "$(id -u)" -o comm= | sort | uniq -c'
          curl --silent --show-error --max-time 20 --resolve koszty.jurkoseo.pl:443:87.98.236.253 -o /dev/null -w 'OVH_HTTPS_STATUS=%{http_code}\n' https://koszty.jurkoseo.pl/app/ || true
      - name: Sprawdź publiczne DNS i ekran logowania
        run: |
          getent ahostsv4 koszty.jurkoseo.pl | head -n 3
          getent ahostsv4 geuveax.cluster131.hosting.ovh.net | head -n 3
          curl --silent --show-error --max-time 20 -L -o /tmp/jurko-login.html -w 'PUBLIC_HTTPS_STATUS=%{http_code}\n' https://koszty.jurkoseo.pl/auth/ || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/jurko-login.html')
          if p.exists():
              text=p.read_text(errors='replace')
              print('GOOGLE_LOGIN_PAGE_OK' if 'Zaloguj przez Google' in text and '<?php' not in text else 'LOGIN_PAGE_NOT_READY')
          PY
      - name: Usuń lokalny klucz publiczny
        if: always()
        run: rm -f ~/.ssh/known_hosts /tmp/ovh-host
