name: Miesięczne prowizje handlowców
on:
  schedule:
    - cron: '15 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jurko-ovh-production
  cancel-in-progress: false
jobs:
  calculate:
    if: github.ref == 'refs/heads/main'
    environment: ovh-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Przelicz dostępne raporty bez wypłat i bez pobierania kluczy
        env:
          SSHPASS: ${{ secrets.OVH_SSH_PASSWORD }}
        run: |
          test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y sshpass
          mkdir -m 700 -p ~/.ssh
          ssh-keyscan -T 15 -t ed25519 ssh.cluster131.hosting.ovh.net > /tmp/ovh-host
          test "$(ssh-keygen -lf /tmp/ovh-host | awk '{print $2}')" = 'SHA256:N4DQHF8Pzfs8s5/QgV8tEx5NgKZeghhkDfpnO+ZG7Fo'
          install -m 600 /tmp/ovh-host ~/.ssh/known_hosts
          sshpass -e ssh -o StrictHostKeyChecking=yes geuveax@ssh.cluster131.hosting.ovh.net 'php' < scripts/sales-monthly.php
      - name: Usuń pliki tymczasowe
        if: always()
        run: rm -f /tmp/ovh-host ~/.ssh/known_hosts
