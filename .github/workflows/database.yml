name: Kontrola bazy MySQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-password
          MYSQL_DATABASE: jurko_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, curl, openssl, gd, zip, xml, xmlreader, xmlwriter
          tools: composer:v2
      - name: Składnia i spójność schematu
        run: |
          find server auth app tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l portal.php
          php -l portal-api.php
          php -l sales-api.php
          node --check owner-panel.js
          node --check portal-client.js
          node --check staff.js
          node --check sales.js
          python3 scripts/build-schema.py --check
          php tests/auth-policy.php
          php tests/portal-policy.php
          sh -n scripts/deploy-ovh.sh
          if env -u JURKO_DB_PASSWORD php scripts/prepare-db.php; then exit 1; fi
          test ! -e /tmp/jurko-db-config.php
      - name: Biblioteka Google
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist
          composer audit
          php -r 'require "vendor/autoload.php"; $c = new Google\Client(); $c->setScopes(["openid","email"]); echo "Biblioteka Google OK\n";'
      - name: Prywatna konfiguracja testowa
        run: |
          mkdir -p ../jurko-private
          php -r 'file_put_contents("../jurko-private/config.php", "<?php return ".var_export(["host"=>"127.0.0.1","database"=>"jurko_test","username"=>"root","password"=>"synthetic-ci-password"],true).";");'
          chmod 700 ../jurko-private
          chmod 600 ../jurko-private/config.php
      - name: Nowa baza, ponowienie i integralność
        run: |
          php server/migrate.php
          php server/migrate.php
          php tests/database.php
          php tests/finance-database.php
          php tests/unified-database.php
          php tests/sales-database.php
          sh tests/portal-http.sh
      - name: Zmiana starej migracji musi być odrzucona
        run: |
          echo '-- zmieniona historia' >> server/migrations/core/001_migrations.sql
          if php server/migrate.php; then exit 1; fi

